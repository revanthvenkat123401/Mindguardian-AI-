version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: mindguardian-postgres
    environment:
      POSTGRES_USER: mindguardian
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mindguardian_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindguardian"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: mindguardian-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mindguardian-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mindguardian:password@postgres:5432/mindguardian_db
      REDIS_URL: redis://redis:6379/0
      DEBUG: "True"
      HOST: 0.0.0.0
      PORT: 8000
      LLM_ENDPOINT: http://host.docker.internal:11434  # Ollama endpoint
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./reports:/app/reports
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama (Optional - for local LLM)
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: mindguardian-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   environment:
  #     - OLLAMA_HOST=0.0.0.0:11434

volumes:
  postgres_data:
  redis_data:
  # ollama_data:

networks:
  default:
    name: mindguardian-network
